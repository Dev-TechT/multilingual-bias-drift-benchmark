# Start:   docker compose up            (pulls the published image)
# Build:   docker compose up --build    (builds from this checkout instead)
# Open:    http://localhost:8000
# Optional: copy .env.example to .env to pre-configure Azure / GitHub / Ollama models or an external judge.
services:
  mbdb:
    image: ghcr.io/dev-techt/multilingual-bias-drift-benchmark:${MBDB_TAG:-latest}
    build: .
    ports:
      - "127.0.0.1:8000:8000"   # localhost only; put a reverse proxy + auth in front for servers
    env_file:
      - path: .env
        required: false        # needs Docker Compose v2.24+
    volumes:
      - mbdb-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama / your own AI on the host
    restart: unless-stopped

volumes:
  mbdb-data:
