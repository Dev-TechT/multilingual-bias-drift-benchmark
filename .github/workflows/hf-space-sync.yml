# Optional: deploy the web app to a Hugging Face Docker Space on every release tag.
# Setup (once): create a Space (SDK: Docker, blank), then in GitHub -> Settings -> Secrets and variables -> Actions add
#   secret   HF_TOKEN  (Hugging Face write token)
#   variable HF_SPACE  (e.g. dev-techt/multilingual-bias-drift-benchmark)
name: Deploy to Hugging Face Space

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Space bundle
        run: bash scripts/build_hf_space.sh deploy/space
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd deploy/space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Deploy ${GITHUB_REF_NAME}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
