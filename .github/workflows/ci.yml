name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests (core + web + reference servers)
        run: uv run --extra dev --extra web python -m pytest -q
      - name: Validate public datasets
        run: uv run python -m fillblank_eval.validator examples/*.jsonl
      - name: Duplicate check
        run: uv run python -m fillblank_eval.duplicates examples/*.jsonl
      - name: Private-data leak scan
        run: uv run python -m fillblank_eval.leak_scan .
      - name: CLI smokes
        run: |
          uv run fillblank-run --dry-run --limit 3 --out-dir /tmp/smoke-dry
          uv run fillblank-run --provider mock-drift --dataset examples/public_core24_15lang.jsonl --workers 4 --out-dir /tmp/smoke-drift
      - name: Inspect adapter smoke
        if: matrix.python-version == '3.12'
        run: uv run --with inspect-ai inspect list tasks adapters/inspect/fillblank_task.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t mbdb:ci .
      - name: Container smoke (health, readiness, demo run)
        run: |
          docker run -d --name mbdb -p 8000:8000 mbdb:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && break; sleep 1; done
          curl -fsS http://localhost:8000/api/ready
          curl -fsS -X POST http://localhost:8000/api/runs -H 'Content-Type: application/json' \
            -d '{"provider":"mock-drift","datasets":["public_top10_sample"],"limit":3}'
      - name: Container logs on failure
        if: failure()
        run: docker logs mbdb
